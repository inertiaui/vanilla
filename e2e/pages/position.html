<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Position</title>
        <link rel="stylesheet" href="shared.css" />
        <style>
            body {
                min-height: 2000px;
                max-width: none;
            }

            #top-layer-popover.force-anchor-overflow[class*='iui-anchor-'] {
                transform: translateY(-999px);
            }
        </style>
    </head>
    <body>
        <div class="pos-panel" style="top: 10px; left: 10px">
            <a href="/" class="back" style="margin-bottom: 0.5rem">All demos</a>
            <div style="font-weight: 600; margin-bottom: 0.5rem">Placement</div>
            <div class="btn-row">
                <button id="pos-bottom-start">bottom-start</button>
                <button id="pos-bottom">bottom</button>
                <button id="pos-bottom-end">bottom-end</button>
            </div>
            <div class="btn-row">
                <button id="pos-top">top</button>
                <button id="pos-top-start">top-start</button>
                <button id="pos-right">right</button>
            </div>
            <div class="btn-row">
                <button id="pos-with-offset">bottom-start +8px</button>
            </div>
            <div style="font-weight: 600; margin: 0.5rem 0 0.25rem">Flip behavior</div>
            <div class="btn-row">
                <button id="pos-flip-btn">Flip (near bottom ref)</button>
                <button id="pos-no-flip">No flip</button>
            </div>
            <div style="font-weight: 600; margin: 0.5rem 0 0.25rem">Auto update</div>
            <div class="btn-row">
                <button id="start-auto-btn">Start</button>
                <button id="stop-auto-btn">Stop</button>
            </div>
            <div style="font-weight: 600; margin: 0.5rem 0 0.25rem">Size</div>
            <div class="btn-row">
                <button id="pos-size-bottom">size bottom</button>
                <button id="pos-size-top">size top (near bottom)</button>
                <button id="pos-size-cap">size + var cap</button>
                <button id="pos-no-size">no size</button>
            </div>
            <div style="font-weight: 600; margin: 0.5rem 0 0.25rem">Top layer</div>
            <div class="btn-row">
                <button id="pos-top-layer">popover</button>
                <button id="pos-top-layer-flip">popover flip</button>
                <button id="pos-top-layer-offset">popover offset</button>
                <button id="pos-top-layer-no-flip">popover no flip</button>
                <button id="pos-top-layer-manual">popover manual</button>
                <button id="pos-top-layer-anchor-overflow">anchor overflow</button>
                <button id="start-top-layer-auto-btn">Start auto</button>
                <button id="start-top-layer-auto-manual-btn">Start manual auto</button>
                <button id="stop-top-layer-auto-btn">Stop auto</button>
            </div>
        </div>

        <div class="pos-panel" style="top: 10px; right: 10px">
            <div style="font-weight: 600; margin-bottom: 0.5rem">Result</div>
            <div>x: <span id="result-x" style="font-family: monospace">-</span></div>
            <div>y: <span id="result-y" style="font-family: monospace">-</span></div>
            <div>placement: <span id="result-placement" style="font-family: monospace">-</span></div>
            <div style="margin-top: 0.5rem; font-weight: 600">Inline styles</div>
            <div>position: <span id="floating-style-pos" style="font-family: monospace">-</span></div>
            <div>top: <span id="floating-style-top" style="font-family: monospace">-</span></div>
            <div>left: <span id="floating-style-left" style="font-family: monospace">-</span></div>
            <div style="margin-top: 0.5rem">
                <span class="status"
                    ><span class="label">autoUpdate:</span> <span class="value" id="auto-update-count">0</span></span
                >
            </div>
            <div style="margin-top: 0.5rem">
                <span class="status"
                    ><span class="label">topLayerAuto:</span>
                    <span class="value" id="top-layer-auto-update-count">0</span></span
                >
            </div>
        </div>

        <div id="reference" class="pos-reference" style="top: 300px; left: 400px">Reference</div>
        <div
            id="reference-wide"
            class="pos-reference"
            style="top: 360px; left: 400px; width: 220px; background: #0f766e"
        >
            Wide reference
        </div>
        <div id="reference-bottom" class="pos-reference" style="bottom: 20px; left: 400px; background: #dc2626">
            Near bottom
        </div>
        <div id="floating" class="pos-floating"></div>
        <div
            id="floating-tall"
            class="pos-floating"
            style="width: 150px; height: auto; padding: 4px; box-sizing: border-box"
        >
            <div style="height: 1500px">Tall content</div>
        </div>
        <div
            id="top-layer-popover"
            class="pos-floating"
            popover="manual"
            style="height: auto; padding: 4px; width: 180px"
        >
            <div style="height: 1500px">Top layer content</div>
        </div>

        <script type="module">
            import {
                computePosition,
                autoUpdate,
                positionTopLayerPopover,
                autoUpdateTopLayerPopover,
                supportsTopLayerAnchorPositioning,
            } from '../../src/index.ts'

            const reference = document.getElementById('reference')
            const referenceWide = document.getElementById('reference-wide')
            const referenceBottom = document.getElementById('reference-bottom')
            const floating = document.getElementById('floating')
            const floatingTall = document.getElementById('floating-tall')
            const topLayerPopover = document.getElementById('top-layer-popover')
            const resultX = document.getElementById('result-x')
            const resultY = document.getElementById('result-y')
            const resultPlacement = document.getElementById('result-placement')
            const floatingStylePos = document.getElementById('floating-style-pos')
            const floatingStyleTop = document.getElementById('floating-style-top')
            const floatingStyleLeft = document.getElementById('floating-style-left')
            const autoUpdateCount = document.getElementById('auto-update-count')
            const topLayerAutoUpdateCount = document.getElementById('top-layer-auto-update-count')

            let autoCleanup = null
            let topLayerAutoCleanup = null
            let updateCount = 0
            let topLayerUpdateCount = 0

            window.supportsTopLayerAnchorPositioning = supportsTopLayerAnchorPositioning

            function showResult(result) {
                floating.style.display = 'block'
                resultX.textContent = String(Math.round(result.x))
                resultY.textContent = String(Math.round(result.y))
                resultPlacement.textContent = result.placement
                floatingStylePos.textContent = floating.style.position
                floatingStyleTop.textContent = floating.style.top
                floatingStyleLeft.textContent = floating.style.left
            }

            function positionWith(ref, options) {
                floating.style.top = ''
                floating.style.left = ''
                floating.style.position = ''
                const result = computePosition(ref, floating, options)
                showResult(result)
            }

            document
                .getElementById('pos-bottom-start')
                .addEventListener('click', () => positionWith(reference, { placement: 'bottom-start' }))
            document
                .getElementById('pos-bottom')
                .addEventListener('click', () => positionWith(reference, { placement: 'bottom' }))
            document
                .getElementById('pos-bottom-end')
                .addEventListener('click', () => positionWith(reference, { placement: 'bottom-end' }))
            document
                .getElementById('pos-top')
                .addEventListener('click', () => positionWith(reference, { placement: 'top' }))
            document
                .getElementById('pos-top-start')
                .addEventListener('click', () => positionWith(reference, { placement: 'top-start' }))
            document
                .getElementById('pos-right')
                .addEventListener('click', () => positionWith(reference, { placement: 'right' }))
            document
                .getElementById('pos-with-offset')
                .addEventListener('click', () => positionWith(reference, { placement: 'bottom-start', offset: 8 }))
            document
                .getElementById('pos-flip-btn')
                .addEventListener('click', () => positionWith(referenceBottom, { placement: 'bottom-start' }))
            document
                .getElementById('pos-no-flip')
                .addEventListener('click', () =>
                    positionWith(referenceBottom, { placement: 'bottom-start', flip: false }),
                )

            function positionTall(ref, options) {
                floatingTall.style.top = ''
                floatingTall.style.left = ''
                floatingTall.style.position = ''
                floatingTall.style.maxHeight = ''
                floatingTall.style.overflowY = ''
                floatingTall.style.removeProperty('--iui-max-height')
                floatingTall.style.display = 'block'
                if (options.cap) {
                    floatingTall.style.setProperty('--iui-max-height', options.cap)
                }
                const result = computePosition(ref, floatingTall, options)
                resultPlacement.textContent = result.placement
            }

            document
                .getElementById('pos-size-bottom')
                .addEventListener('click', () => positionTall(reference, { placement: 'bottom-start', autoSize: true }))
            document
                .getElementById('pos-size-top')
                .addEventListener('click', () =>
                    positionTall(referenceBottom, { placement: 'bottom-start', autoSize: true }),
                )
            document
                .getElementById('pos-size-cap')
                .addEventListener('click', () =>
                    positionTall(reference, { placement: 'bottom-start', autoSize: true, cap: '120px' }),
                )
            document
                .getElementById('pos-no-size')
                .addEventListener('click', () => positionTall(reference, { placement: 'bottom-start' }))

            document.getElementById('start-auto-btn').addEventListener('click', () => {
                autoCleanup?.()
                updateCount = 0
                autoUpdateCount.textContent = '0'
                floating.style.display = 'block'
                autoCleanup = autoUpdate(reference, floating, () => {
                    updateCount++
                    autoUpdateCount.textContent = String(updateCount)
                    computePosition(reference, floating, { placement: 'bottom-start' })
                })
            })

            document.getElementById('stop-auto-btn').addEventListener('click', () => {
                autoCleanup?.()
                autoCleanup = null
            })

            function showTopLayer(ref, options, modifiers = {}) {
                topLayerAutoCleanup?.()
                topLayerAutoCleanup = null
                topLayerPopover.style.width = '180px'
                topLayerPopover.style.maxWidth = ''
                topLayerPopover.style.maxHeight = ''
                topLayerPopover.style.left = ''
                topLayerPopover.style.top = ''
                topLayerPopover.style.display = 'block'
                topLayerPopover.classList.toggle('force-anchor-overflow', modifiers.forceAnchorOverflow === true)

                if (!topLayerPopover.matches(':popover-open')) {
                    topLayerPopover.showPopover()
                }

                const result = positionTopLayerPopover(ref, topLayerPopover, options)
                resultX.textContent = String(Math.round(result.x))
                resultY.textContent = String(Math.round(result.y))
                resultPlacement.textContent = result.placement
                floatingStylePos.textContent = topLayerPopover.style.position
                floatingStyleTop.textContent = topLayerPopover.style.top
                floatingStyleLeft.textContent = topLayerPopover.style.left
            }

            document.getElementById('pos-top-layer').addEventListener('click', () => {
                showTopLayer(referenceWide, { placement: 'bottom-start', matchReferenceWidth: true, viewportMargin: 8 })
            })

            document.getElementById('pos-top-layer-flip').addEventListener('click', () => {
                showTopLayer(referenceBottom, {
                    placement: 'bottom-start',
                    matchReferenceWidth: true,
                    viewportMargin: 8,
                })
            })

            document.getElementById('pos-top-layer-offset').addEventListener('click', () => {
                showTopLayer(referenceWide, {
                    placement: 'bottom-start',
                    offset: 12,
                    matchReferenceWidth: false,
                    viewportMargin: 16,
                    anchorPositioning: false,
                })
            })

            document.getElementById('pos-top-layer-no-flip').addEventListener('click', () => {
                showTopLayer(referenceBottom, {
                    placement: 'bottom-start',
                    flip: false,
                    matchReferenceWidth: false,
                    viewportMargin: 8,
                    anchorPositioning: false,
                })
            })

            document.getElementById('pos-top-layer-manual').addEventListener('click', () => {
                showTopLayer(referenceWide, {
                    placement: 'bottom-start',
                    matchReferenceWidth: true,
                    viewportMargin: 8,
                    anchorPositioning: false,
                })
            })

            document.getElementById('pos-top-layer-anchor-overflow').addEventListener('click', () => {
                showTopLayer(
                    referenceWide,
                    { placement: 'bottom-start', matchReferenceWidth: true, viewportMargin: 8 },
                    { forceAnchorOverflow: true },
                )
            })

            function startTopLayerAuto(ref, options) {
                topLayerAutoCleanup?.()
                topLayerUpdateCount = 0
                topLayerAutoUpdateCount.textContent = '0'
                showTopLayer(ref, options)
                topLayerAutoCleanup = autoUpdateTopLayerPopover(ref, topLayerPopover, () => {
                    topLayerUpdateCount++
                    topLayerAutoUpdateCount.textContent = String(topLayerUpdateCount)
                    positionTopLayerPopover(ref, topLayerPopover, options)
                })
            }

            document.getElementById('start-top-layer-auto-btn').addEventListener('click', () => {
                startTopLayerAuto(referenceWide, {
                    placement: 'bottom-start',
                    matchReferenceWidth: true,
                    viewportMargin: 8,
                })
            })

            document.getElementById('start-top-layer-auto-manual-btn').addEventListener('click', () => {
                startTopLayerAuto(referenceWide, {
                    placement: 'bottom-start',
                    matchReferenceWidth: true,
                    viewportMargin: 8,
                    anchorPositioning: false,
                })
            })

            document.getElementById('stop-top-layer-auto-btn').addEventListener('click', () => {
                topLayerAutoCleanup?.()
                topLayerAutoCleanup = null
            })
        </script>
    </body>
</html>
