<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aria Hidden</title>
</head>
<body>
    <h1>Aria Hidden</h1>

    <div id="target">Target element</div>
    <div id="target-with-value" aria-hidden="false">Target with existing value</div>

    <button id="mark-btn">Mark #target</button>
    <button id="unmark-btn">Unmark #target</button>
    <button id="mark-by-selector-btn">Mark by selector</button>
    <button id="mark-existing-btn">Mark #target-with-value</button>
    <button id="unmark-existing-btn">Unmark #target-with-value</button>
    <button id="mark-nonexistent-btn">Mark nonexistent</button>
    <button id="unmark-nonexistent-btn">Unmark nonexistent</button>

    <p>Target aria-hidden: <span id="aria-value">null</span></p>
    <p>Existing aria-hidden: <span id="aria-value-existing">false</span></p>

    <script type="module">
        import { markAriaHidden } from '../../src/index.ts'

        const target = document.getElementById('target')
        const targetWithValue = document.getElementById('target-with-value')
        const ariaValue = document.getElementById('aria-value')
        const ariaValueExisting = document.getElementById('aria-value-existing')

        let cleanups = []
        let existingCleanups = []
        let nonexistentCleanup = null

        function updateDisplay() {
            ariaValue.textContent = target.getAttribute('aria-hidden') ?? 'null'
            ariaValueExisting.textContent = targetWithValue.getAttribute('aria-hidden') ?? 'null'
        }

        document.getElementById('mark-btn').addEventListener('click', () => {
            cleanups.push(markAriaHidden(target))
            updateDisplay()
        })

        document.getElementById('unmark-btn').addEventListener('click', () => {
            const fn = cleanups.pop()
            fn?.()
            updateDisplay()
        })

        document.getElementById('mark-by-selector-btn').addEventListener('click', () => {
            cleanups.push(markAriaHidden('#target'))
            updateDisplay()
        })

        document.getElementById('mark-existing-btn').addEventListener('click', () => {
            existingCleanups.push(markAriaHidden(targetWithValue))
            updateDisplay()
        })

        document.getElementById('unmark-existing-btn').addEventListener('click', () => {
            const fn = existingCleanups.pop()
            fn?.()
            updateDisplay()
        })

        document.getElementById('mark-nonexistent-btn').addEventListener('click', () => {
            nonexistentCleanup = markAriaHidden('#does-not-exist')
            updateDisplay()
        })

        document.getElementById('unmark-nonexistent-btn').addEventListener('click', () => {
            nonexistentCleanup?.()
            nonexistentCleanup = null
            updateDisplay()
        })
    </script>
</body>
</html>
