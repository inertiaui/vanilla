<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; }
        .hidden { display: none; }
        .menu { border: 1px solid #ccc; padding: 0.5rem; margin: 0.5rem 0; }
        .menu button, .menu div { display: block; width: 100%; text-align: left; padding: 0.5rem; border: none; background: none; cursor: pointer; }
        .menu button:focus, .menu div:focus { background: #e0e7ff; outline: 2px solid #4f46e5; }
    </style>
</head>
<body>
    <h1>Menu</h1>

    <button id="open-vertical-btn">Open Vertical</button>
    <button id="open-horizontal-btn">Open Horizontal</button>
    <button id="open-noloop-btn">Open No-Loop</button>
    <button id="open-no-typeahead-btn">Open No Type-Ahead</button>
    <button id="open-custom-btn">Open Custom Selector</button>
    <button id="close-btn">Close All</button>

    <!-- Vertical menu with disabled items -->
    <div id="menu-vertical" class="menu hidden" role="menu">
        <button id="v-item-0" role="menuitem" data-action="apple">Apple</button>
        <button id="v-item-1" role="menuitem" data-action="banana">Banana</button>
        <button id="v-item-2" role="menuitem" data-action="cherry" disabled>Cherry</button>
        <button id="v-item-3" role="menuitem" data-action="date" aria-disabled="true">Date</button>
        <button id="v-item-4" role="menuitem" data-action="elderberry">Elderberry</button>
    </div>

    <!-- Horizontal menu -->
    <div id="menu-horizontal" class="menu hidden" role="menu">
        <button id="h-item-0" role="menuitem">Left</button>
        <button id="h-item-1" role="menuitem">Center</button>
        <button id="h-item-2" role="menuitem">Right</button>
    </div>

    <!-- No-loop menu -->
    <div id="menu-noloop" class="menu hidden" role="menu">
        <button id="nl-item-0" role="menuitem">First</button>
        <button id="nl-item-1" role="menuitem">Second</button>
        <button id="nl-item-2" role="menuitem">Third</button>
    </div>

    <!-- No type-ahead menu -->
    <div id="menu-no-typeahead" class="menu hidden" role="menu">
        <button id="nt-item-0" role="menuitem">Alpha</button>
        <button id="nt-item-1" role="menuitem">Beta</button>
    </div>

    <!-- Custom selector menu -->
    <div id="menu-custom" class="menu hidden">
        <div id="c-item-0" class="nav-item" tabindex="-1">Nav One</div>
        <div id="c-item-1" class="nav-item" tabindex="-1">Nav Two</div>
        <div id="c-item-2" class="nav-item" tabindex="-1">Nav Three</div>
    </div>

    <p>Activated: <span id="activate-log"></span></p>
    <p>Active: <span id="active-element"></span></p>

    <script type="module">
        import { createMenuNavigation } from '../../src/index.ts'

        const activateLog = document.getElementById('activate-log')
        const activeElement = document.getElementById('active-element')
        let cleanup = null

        document.addEventListener('focusin', () => {
            activeElement.textContent = document.activeElement?.id || 'none'
        })

        function closeAll() {
            cleanup?.()
            cleanup = null
            document.querySelectorAll('.menu').forEach(m => m.classList.add('hidden'))
        }

        document.getElementById('open-vertical-btn').addEventListener('click', () => {
            closeAll()
            document.getElementById('menu-vertical').classList.remove('hidden')
            cleanup = createMenuNavigation(document.getElementById('menu-vertical'), {
                onActivate: (item) => { activateLog.textContent = item.dataset.action || item.textContent }
            })
        })

        document.getElementById('open-horizontal-btn').addEventListener('click', () => {
            closeAll()
            document.getElementById('menu-horizontal').classList.remove('hidden')
            cleanup = createMenuNavigation(document.getElementById('menu-horizontal'), {
                orientation: 'horizontal',
                onActivate: (item) => { activateLog.textContent = item.textContent }
            })
        })

        document.getElementById('open-noloop-btn').addEventListener('click', () => {
            closeAll()
            document.getElementById('menu-noloop').classList.remove('hidden')
            cleanup = createMenuNavigation(document.getElementById('menu-noloop'), {
                loop: false,
                onActivate: (item) => { activateLog.textContent = item.textContent }
            })
        })

        document.getElementById('open-no-typeahead-btn').addEventListener('click', () => {
            closeAll()
            document.getElementById('menu-no-typeahead').classList.remove('hidden')
            cleanup = createMenuNavigation(document.getElementById('menu-no-typeahead'), {
                typeAhead: false,
                onActivate: (item) => { activateLog.textContent = item.textContent }
            })
        })

        document.getElementById('open-custom-btn').addEventListener('click', () => {
            closeAll()
            document.getElementById('menu-custom').classList.remove('hidden')
            cleanup = createMenuNavigation(document.getElementById('menu-custom'), {
                itemSelector: '.nav-item',
                onActivate: (item) => { activateLog.textContent = item.textContent }
            })
        })

        document.getElementById('close-btn').addEventListener('click', closeAll)

        // Expose for cleanup test
        window.closeAll = closeAll
    </script>
</body>
</html>
