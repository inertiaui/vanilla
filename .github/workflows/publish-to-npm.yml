name: Publish to NPM

on:
    release:
        types: [created]
    workflow_dispatch:

permissions: {}

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '22.22.1'
                  registry-url: 'https://registry.npmjs.org'
                  cache: pnpm

            - name: Install dependencies, build, and publish
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build
                  pnpm pack
                  pnpm publish --access public --provenance --no-git-checks
