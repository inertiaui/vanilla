name: Semgrep

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: '37 4 * * 1'

permissions: {}

jobs:
    semgrep:
        name: Semgrep scan
        runs-on: ubuntu-latest
        timeout-minutes: 15

        permissions:
            contents: read

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: '3.12'

            - name: Install Semgrep
              run: pip install semgrep==1.164.0

            - name: Run Semgrep
              run: semgrep scan --config=p/default --config=p/security-audit --config=p/owasp-top-ten --error --severity=ERROR
